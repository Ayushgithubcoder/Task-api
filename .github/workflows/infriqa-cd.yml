name: CD Pipeline
'on':
  push:
    branches:
    - InfrIQa
    - InfrIQa-dev
    - dev
    - development
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
env:
  AZURE_SUBSCRIPTION_ID: d6c69b8a-1b49-482e-80c0-95ccb98fd3c6
  AZURE_RESOURCE_GROUP: Test-01-dev-rg
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
jobs:
  deploy-frontend-test-01-dev-frontend-web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Build frontend
      run: echo 'No build step required'
    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP }}
        repo_token: ${{ github.token }}
        action: upload
        app_location: src/public/
        output_location: ''
        skip_app_build: true
    - name: Verify Frontend Deployment
      run: "echo 'Verifying frontend deployment health at https://calm-ocean-0a4a1d810.7.azurestaticapps.net...'\nsuccess=false\nwait_sec=5\nfor i in {1..10}; do\n  if curl -s -f \"https://calm-ocean-0a4a1d810.7.azurestaticapps.net\" > /dev/null; then\n    echo '\u2705 Frontend health check passed!'\n    success=true\n    break\n  fi\n  echo \"Attempt $i failed. Retrying in ${wait_sec}s...\"\n  sleep $wait_sec\n  wait_sec=$((wait_sec * 2 > 120 ? 120 : wait_sec * 2))\ndone\nif [ \"$success\" = false ]; then\n  echo '\u274C Frontend health check failed after all attempts.'\n  exit 1\nfi"
  deploy-backend-test-01-dev-task-manager-api:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Login to ACR
      run: az acr login --name test01devinfrastructure1
    - name: Build and Push Docker Image
      run: |-
        docker build -t test01devinfrastructure1.azurecr.io/test-01-dev-task-manager-api:${{ github.sha }} -t test01devinfrastructure1.azurecr.io/test-01-dev-task-manager-api:latest -f Dockerfile .
        docker push test01devinfrastructure1.azurecr.io/test-01-dev-task-manager-api:${{ github.sha }}
        docker push test01devinfrastructure1.azurecr.io/test-01-dev-task-manager-api:latest
    - name: Deploy to Container App
      run: |-
        ACR_USER=$(az acr credential show --name test01devinfrastructure1 --query 'username' -o tsv)
        ACR_PASS=$(az acr credential show --name test01devinfrastructure1 --query 'passwords[0].value' -o tsv)
        az containerapp registry set \
          --name test-01-dev-task-manager-api \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --server test01devinfrastructure1.azurecr.io \
          --username "$ACR_USER" \
          --password "$ACR_PASS"
        az containerapp ingress update \
          --name test-01-dev-task-manager-api \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --target-port 5000
        az containerapp update \
          --name test-01-dev-task-manager-api \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image test01devinfrastructure1.azurecr.io/test-01-dev-task-manager-api:${{ github.sha }}
  deploy-database-test-01-dev-pg:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Verify PostgreSQL Flexible Server
      run: az postgres flexible-server show --name test-01-dev-pg --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query 'fullyQualifiedDomainName' -o tsv
  configure-cors:
    runs-on: ubuntu-latest
    needs:
    - deploy-frontend-test-01-dev-frontend-web-app
    - deploy-backend-test-01-dev-task-manager-api
    steps:
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Configure CORS and Frontend URL on Backend
      run: |-
        echo "Fetching Static Web App actual live hostname..."
        FRONTEND_HOST=$(az staticwebapp environment list --name test-01-dev-frontend-web-app \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "[0].hostname" -o tsv)
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname via environment list, trying fallback..."
          FRONTEND_HOST=$(az staticwebapp show --name test-01-dev-frontend-web-app \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "defaultHostname" -o tsv)
        fi
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname. Skipping CORS configuration."
          exit 0
        fi
        echo "Frontend hostname: $FRONTEND_HOST"
        echo "Setting CORS on container app: test-01-dev-task-manager-api..."
        az containerapp update --name test-01-dev-task-manager-api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --cors-allowed-origins "https://$FRONTEND_HOST"
